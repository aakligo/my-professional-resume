name: build and push to ECR

on:
    push:
      #pull_request:
      # branches: ['main','dev']
      branches: ['main']

jobs:
    build-scan:
        runs-on: ubuntu-latest
        steps:
          - name: Checkout the code
            uses: actions/checkout@v7
          - name: Trivy Scan
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              scan-type: 'fs'
              severity: "HIGH,CRITICAL"
              exit-code: 0

          
          - name: Build Docker Image
            run: docker build -t  301236973225.dkr.ecr.us-east-1.amazonaws.com/my_repo:latest .
          - name: Scan image with Trivy
            uses: aquasecurity/trivy-action@v0.36.0
            with:
              image-ref: 301236973225.dkr.ecr.us-east-1.amazonaws.com/my_repo:latest
              format: table
              exit-code: 0
              ignore-unfixed: true
              severity: "HIGH,CRITICAL"
          - name: Push Image to Ecr

            run: echo "push"

        
            
        


              
            
  
    